services:
  oracle-xe:
    image: "container-registry.oracle.com/database/express:latest"
    container_name: "oracle-xe"
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      ORACLE_PWD: ${ORACLE_PWD}
    volumes:
      - "oracle-xe-data:/opt/oracle/oradata"

volumes:
  oracle-xe-data: