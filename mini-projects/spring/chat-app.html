<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0f1117;
    --bg2:       #181c27;
    --bg3:       #1e2333;
    --bg4:       #252b3b;
    --bg5:       #2d3449;
    --accent:    #4f8ef7;
    --accent2:   #3a6fd8;
    --accent-tl: rgba(79,142,247,0.12);
    --sent:      #1a3a6b;
    --recv:      #1e2333;
    --text:      #e8eaf0;
    --text2:     #8b92a8;
    --text3:     #5a6075;
    --border:    rgba(255,255,255,0.06);
    --border2:   rgba(255,255,255,0.10);
    --online:    #3ecf8e;
    --danger:    #f06a6a;
    --radius:    12px;
    --font:      'DM Sans', sans-serif;
    --mono:      'DM Mono', monospace;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* ── SIDEBAR ─────────────────────────────────────── */
  #sidebar {
    width: 340px;
    min-width: 280px;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    flex-shrink: 0;
  }

  #sidebar-header {
    padding: 20px 18px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  #sidebar-header h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.4px;
    background: linear-gradient(135deg, #e8eaf0, #4f8ef7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .header-actions { display: flex; gap: 8px; }

  .icon-btn {
    width: 34px; height: 34px;
    border-radius: 8px;
    background: var(--bg4);
    border: 1px solid var(--border);
    color: var(--text2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    font-size: 15px;
  }
  .icon-btn:hover { background: var(--bg5); color: var(--text); }

  /* Search */
  #search-wrap {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }

  #search-wrap .search-inner {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    transition: border-color 0.15s;
  }
  #search-wrap .search-inner:focus-within {
    border-color: var(--accent);
  }

  #search-input {
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    flex: 1;
  }
  #search-input::placeholder { color: var(--text3); }

  .search-icon { color: var(--text3); font-size: 14px; flex-shrink: 0; }

  /* Contact List */
  #contact-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }
  #contact-list::-webkit-scrollbar { width: 4px; }
  #contact-list::-webkit-scrollbar-track { background: transparent; }
  #contact-list::-webkit-scrollbar-thumb { background: var(--bg5); border-radius: 4px; }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    cursor: pointer;
    transition: background 0.12s;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .contact-item:hover { background: var(--bg3); }
  .contact-item.active { background: var(--bg4); }
  .contact-item.active::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    border-radius: 0 2px 2px 0;
  }

  .avatar {
    width: 46px; height: 46px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--bg5);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    font-weight: 500;
    color: var(--text2);
    overflow: hidden;
    position: relative;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .avatar .online-dot {
    position: absolute;
    bottom: 2px; right: 2px;
    width: 10px; height: 10px;
    background: var(--online);
    border-radius: 50%;
    border: 2px solid var(--bg2);
  }

  .contact-info { flex: 1; min-width: 0; }
  .contact-name-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 3px;
  }
  .contact-name {
    font-size: 14px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .contact-time { font-size: 11px; color: var(--text3); flex-shrink: 0; margin-left: 8px; }
  .contact-last-msg {
    font-size: 13px; color: var(--text2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .unread-badge {
    background: var(--accent);
    color: #fff;
    font-size: 11px; font-weight: 600;
    padding: 2px 6px;
    border-radius: 10px;
    margin-left: 6px;
    flex-shrink: 0;
  }

  /* ── MAIN CHAT ────────────────────────────────────── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }

  /* Chat BG pattern */
  #main::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(79,142,247,0.04) 1px, transparent 0);
    background-size: 28px 28px;
    pointer-events: none;
  }

  /* Empty state */
  #empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text3);
    gap: 12px;
    position: relative;
    z-index: 1;
  }
  #empty-state .empty-icon {
    font-size: 56px;
    opacity: 0.3;
  }
  #empty-state p { font-size: 15px; }

  /* Chat Header */
  #chat-header {
    display: none;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 2;
    flex-shrink: 0;
  }

  #chat-header .chat-contact-name {
    font-size: 16px; font-weight: 600;
  }
  #chat-header .chat-contact-status {
    font-size: 12px; color: var(--online);
    margin-top: 1px;
  }
  #chat-header .chat-contact-status.offline { color: var(--text3); }

  .chat-header-actions { margin-left: auto; display: flex; gap: 8px; }

  /* Messages */
  #messages-wrap {
    display: none;
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
    z-index: 1;
  }
  #messages-wrap::-webkit-scrollbar { width: 4px; }
  #messages-wrap::-webkit-scrollbar-thumb { background: var(--bg5); border-radius: 4px; }

  .msg-bubble {
    max-width: 65%;
    padding: 9px 14px 6px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    position: relative;
    word-break: break-word;
    animation: popIn 0.18s ease;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.94) translateY(4px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .msg-sent {
    align-self: flex-end;
    background: var(--sent);
    border-bottom-right-radius: 4px;
    color: var(--text);
  }

  .msg-received {
    align-self: flex-start;
    background: var(--recv);
    border: 1px solid var(--border2);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  .msg-time {
    font-size: 11px;
    color: var(--text3);
    margin-top: 3px;
    text-align: right;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
  }
  .msg-received .msg-time { justify-content: flex-start; }

  .msg-check { color: var(--accent); font-size: 12px; }

  .date-divider {
    align-self: center;
    font-size: 12px;
    color: var(--text3);
    background: var(--bg3);
    border: 1px solid var(--border);
    padding: 3px 12px;
    border-radius: 20px;
    margin: 8px 0;
  }

  /* Input */
  #input-area {
    display: none;
    padding: 12px 16px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    gap: 10px;
    align-items: flex-end;
    position: relative;
    z-index: 2;
    flex-shrink: 0;
  }

  #msg-input {
    flex: 1;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 10px 16px;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    outline: none;
    resize: none;
    max-height: 120px;
    overflow-y: auto;
    transition: border-color 0.15s;
    line-height: 1.5;
  }
  #msg-input:focus { border-color: var(--accent); }
  #msg-input::placeholder { color: var(--text3); }
  #msg-input::-webkit-scrollbar { width: 0; }

  #send-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  #send-btn:hover { background: var(--accent2); transform: scale(1.06); }
  #send-btn:active { transform: scale(0.96); }
  #send-btn:disabled { background: var(--bg5); cursor: not-allowed; transform: none; }

  /* Loading & error */
  .loading-row {
    display: flex; align-items: center; justify-content: center;
    padding: 20px; color: var(--text3); font-size: 13px; gap: 8px;
  }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--bg5);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--bg4); border: 1px solid var(--border2);
    color: var(--text); padding: 10px 18px; border-radius: 10px;
    font-size: 13px; z-index: 999; pointer-events: none;
    opacity: 0; transition: opacity 0.2s;
    max-width: 320px; text-align: center;
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--danger); color: var(--danger); }

  /* Modal new contact */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.6); z-index: 100;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg2); border: 1px solid var(--border2);
    border-radius: var(--radius); padding: 24px;
    width: 340px; display: flex; flex-direction: column; gap: 14px;
  }
  .modal h2 { font-size: 16px; font-weight: 600; }
  .modal input, .modal textarea {
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 12px;
    color: var(--text); font-family: var(--font); font-size: 14px;
    outline: none; width: 100%;
    transition: border-color 0.15s;
  }
  .modal input:focus, .modal textarea:focus { border-color: var(--accent); }
  .modal textarea { resize: vertical; min-height: 70px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .btn-primary {
    background: var(--accent); color: #fff; border: none;
    padding: 8px 18px; border-radius: 8px; font-family: var(--font);
    font-size: 14px; cursor: pointer; transition: background 0.15s;
  }
  .btn-primary:hover { background: var(--accent2); }
  .btn-secondary {
    background: var(--bg4); color: var(--text2); border: 1px solid var(--border);
    padding: 8px 18px; border-radius: 8px; font-family: var(--font);
    font-size: 14px; cursor: pointer; transition: background 0.15s;
  }
  .btn-secondary:hover { background: var(--bg5); }

  /* ── CONFIG panel ────── */
  #config-panel {
    display: none; position: fixed; top: 60px; right: 16px;
    background: var(--bg2); border: 1px solid var(--border2);
    border-radius: var(--radius); padding: 16px;
    width: 280px; z-index: 50; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  #config-panel.open { display: block; }
  #config-panel h3 { font-size: 13px; color: var(--text2); margin-bottom: 10px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; }
  #config-panel label { font-size: 13px; color: var(--text2); display: block; margin-bottom: 4px; }
  #config-panel input {
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px;
    color: var(--text); font-family: var(--mono); font-size: 13px;
    outline: none; width: 100%; margin-bottom: 10px;
    transition: border-color 0.15s;
  }
  #config-panel input:focus { border-color: var(--accent); }
  #current-user-label { font-size: 12px; color: var(--text3); margin-top: 2px; margin-bottom: 12px; }

  /* SVG icons inline */
  .svg-icon { display: inline-block; vertical-align: middle; }
</style>
</head>
<body>

<!-- ── SIDEBAR ── -->
<div id="sidebar">
  <div id="sidebar-header">
    <h1>ChatApp</h1>
    <div class="header-actions">
      <button class="icon-btn" id="new-contact-btn" title="Nuevo contacto">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/></svg>
      </button>
      <button class="icon-btn" id="config-btn" title="Configuración">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>

  <div id="search-wrap">
    <div class="search-inner">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search-input" type="text" placeholder="Buscar contacto...">
    </div>
  </div>

  <div id="contact-list">
    <div class="loading-row"><div class="spinner"></div> Cargando contactos...</div>
  </div>
</div>

<!-- ── MAIN ── -->
<div id="main">
  <div id="empty-state">
    <div class="empty-icon">💬</div>
    <p>Selecciona un chat para empezar</p>
  </div>

  <div id="chat-header">
    <div class="avatar" id="header-avatar"></div>
    <div>
      <div class="chat-contact-name" id="header-name">—</div>
      <div class="chat-contact-status offline" id="header-status">Sin conexión</div>
    </div>
    <div class="chat-header-actions">
      <button class="icon-btn" id="refresh-btn" title="Actualizar mensajes">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>
      <button class="icon-btn danger" id="delete-chat-btn" title="Eliminar chat" style="color: var(--danger)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      </button>
    </div>
  </div>

  <div id="messages-wrap"></div>

  <div id="input-area">
    <textarea id="msg-input" rows="1" placeholder="Escribe un mensaje..."></textarea>
    <button id="send-btn" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<!-- ── CONFIG PANEL ── -->
<div id="config-panel">
  <h3>Configuración API</h3>
  <label>Base URL</label>
  <input id="cfg-base-url" value="http://localhost:8080/api">
  <label>Tu ID de usuario (sender)</label>
  <input id="cfg-user-id" type="number" value="1" min="1">
  <div id="current-user-label">Mensajes enviados como ID: <strong id="uid-label">1</strong></div>
  <button class="btn-primary" id="cfg-save-btn" style="width:100%">Guardar y recargar</button>
</div>

<!-- ── MODAL NUEVO CONTACTO ── -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2>Nuevo contacto</h2>
    <input id="nc-name" type="text" placeholder="Nombre *">
    <input id="nc-phone" type="text" placeholder="Teléfono">
    <input id="nc-email" type="text" placeholder="Email">
    <input id="nc-photo" type="text" placeholder="URL foto (opcional)">
    <div class="modal-actions">
      <button class="btn-secondary" id="modal-cancel">Cancelar</button>
      <button class="btn-primary" id="modal-save">Guardar</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ── CONFIG ───────────────────────────────────────────────
let BASE_URL = localStorage.getItem('chatapp_base') || 'http://localhost:8080/api';
let MY_ID    = parseInt(localStorage.getItem('chatapp_uid') || '1');

document.getElementById('cfg-base-url').value = BASE_URL;
document.getElementById('cfg-user-id').value  = MY_ID;
document.getElementById('uid-label').textContent = MY_ID;

// ── STATE ────────────────────────────────────────────────
let contacts       = [];
let currentContact = null;
let currentChat    = null;
let pollTimer      = null;

// ── HELPERS ──────────────────────────────────────────────
const $ = id => document.getElementById(id);

function showToast(msg, isError = false) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => { t.className = 'toast'; }, 3000);
}

function formatTime(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return 'ahora';
  if (diff < 3600000) return `${Math.floor(diff/60000)}m`;
  if (d.toDateString() === now.toDateString()) {
    return d.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
  }
  const yesterday = new Date(now); yesterday.setDate(yesterday.getDate()-1);
  if (d.toDateString() === yesterday.toDateString()) return 'ayer';
  return d.toLocaleDateString('es', { day: 'numeric', month: 'short' });
}

function formatFullTime(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  return d.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
}

function getInitials(name) {
  if (!name) return '?';
  return name.split(' ').slice(0,2).map(n => n[0]).join('').toUpperCase();
}

function buildAvatar(contact, size = 46) {
  const el = document.createElement('div');
  el.className = 'avatar';
  el.style.width = el.style.height = size + 'px';
  el.style.fontSize = Math.floor(size * 0.38) + 'px';
  if (contact?.photoUrl || contact?.photo) {
    const img = document.createElement('img');
    img.src = contact.photoUrl || contact.photo;
    img.onerror = () => { el.textContent = getInitials(contact.name); };
    el.appendChild(img);
  } else {
    el.textContent = getInitials(contact?.name || '?');
  }
  return el;
}

// ── API CALLS ────────────────────────────────────────────
async function api(path, opts = {}) {
  const res = await fetch(BASE_URL + path, {
    headers: { 'Content-Type': 'application/json', ...opts.headers },
    ...opts
  });
  if (!res.ok) {
    const txt = await res.text().catch(() => res.statusText);
    throw new Error(`${res.status} ${txt}`);
  }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('json') ? res.json() : res.text();
}

// ── CONTACTS ─────────────────────────────────────────────
async function loadContacts() {
  $('contact-list').innerHTML = '<div class="loading-row"><div class="spinner"></div> Cargando...</div>';
  try {
    contacts = await api('/contacts');
    renderContacts(contacts);
  } catch (e) {
    $('contact-list').innerHTML = `<div class="loading-row" style="color:var(--danger)">Error: ${e.message}<br><small>¿Está corriendo el backend?</small></div>`;
  }
}

function renderContacts(list) {
  const ul = $('contact-list');
  if (!list.length) {
    ul.innerHTML = '<div class="loading-row" style="color:var(--text3)">Sin contactos. ¡Añade uno!</div>';
    return;
  }
  ul.innerHTML = '';
  list.forEach(c => {
    const item = document.createElement('div');
    item.className = 'contact-item' + (currentContact?.id === c.id ? ' active' : '');
    item.dataset.id = c.id;

    const av = buildAvatar(c, 46);
    // Simulamos online si tienen chat reciente
    const onlineDot = document.createElement('div');
    onlineDot.className = 'online-dot';
    av.appendChild(onlineDot);

    const info = document.createElement('div');
    info.className = 'contact-info';

    const nameRow = document.createElement('div');
    nameRow.className = 'contact-name-row';

    const name = document.createElement('span');
    name.className = 'contact-name';
    name.textContent = c.name || c.nombre || 'Sin nombre';

    const time = document.createElement('span');
    time.className = 'contact-time';
    time.textContent = formatTime(c.lastMessageTime || c.updatedAt || c.createdAt);

    nameRow.appendChild(name);
    nameRow.appendChild(time);

    const last = document.createElement('div');
    last.className = 'contact-last-msg';
    last.textContent = c.lastMessage || c.lastMsg || '—';

    info.appendChild(nameRow);
    info.appendChild(last);
    item.appendChild(av);
    item.appendChild(info);

    item.addEventListener('click', () => selectContact(c, item));
    ul.appendChild(item);
  });
}

function filterContacts(q) {
  const term = q.toLowerCase();
  const filtered = contacts.filter(c => {
    const name = (c.name || c.nombre || '').toLowerCase();
    const phone = (c.phone || c.telefono || '').toLowerCase();
    return name.includes(term) || phone.includes(term);
  });
  renderContacts(filtered);
}

// ── SELECT CONTACT → LOAD CHAT ────────────────────────────
async function selectContact(c, itemEl) {
  document.querySelectorAll('.contact-item').forEach(el => el.classList.remove('active'));
  itemEl?.classList.add('active');
  currentContact = c;

  // Show skeleton
  $('empty-state').style.display = 'none';
  $('chat-header').style.display = 'flex';
  $('messages-wrap').style.display = 'flex';
  $('input-area').style.display = 'flex';

  // Header
  const hAv = $('header-avatar');
  hAv.innerHTML = '';
  const av = buildAvatar(c, 40);
  av.style.width = av.style.height = '40px';
  hAv.replaceWith(av);
  av.id = 'header-avatar';

  $('header-name').textContent = c.name || c.nombre || 'Sin nombre';
  $('header-status').textContent = 'En línea';
  $('header-status').classList.remove('offline');

  $('messages-wrap').innerHTML = '<div class="loading-row"><div class="spinner"></div> Cargando chat...</div>';
  $('send-btn').disabled = true;

  clearInterval(pollTimer);

  try {
    // 1. buscar o crear chat para este contacto
    currentChat = await getOrCreateChat(c.id);
    await loadMessages(currentChat.id);
    $('send-btn').disabled = false;

    // polling cada 4s
    pollTimer = setInterval(() => loadMessages(currentChat.id, true), 4000);
  } catch (e) {
    $('messages-wrap').innerHTML = `<div class="loading-row" style="color:var(--danger)">Error cargando chat: ${e.message}</div>`;
    showToast('Error: ' + e.message, true);
  }
}

// ── CHAT ─────────────────────────────────────────────────
async function getOrCreateChat(contactId) {
  // Intenta GET /chats?contactId=X o /chats/contact/{id}
  let chat;
  try {
    const chats = await api(`/chats`);
    // Busca chat que involucre al contacto
    chat = chats.find(ch =>
      ch.contactId === contactId ||
      ch.contact?.id === contactId ||
      (ch.participants && ch.participants.some(p => p.id === contactId || p === contactId))
    );
  } catch(_) {}

  if (!chat) {
    // Crea nuevo chat
    chat = await api('/chats', {
      method: 'POST',
      body: JSON.stringify({ contactId, userId: MY_ID })
    });
  }
  return chat;
}

// ── MESSAGES ─────────────────────────────────────────────
let lastMsgCount = 0;

async function loadMessages(chatId, silent = false) {
  if (!silent) {
    $('messages-wrap').innerHTML = '<div class="loading-row"><div class="spinner"></div></div>';
  }
  try {
    const msgs = await api(`/messages?chatId=${chatId}`);
    if (msgs.length !== lastMsgCount || !silent) {
      lastMsgCount = msgs.length;
      renderMessages(msgs);
    }
  } catch (e) {
    if (!silent) {
      $('messages-wrap').innerHTML = `<div class="loading-row" style="color:var(--danger)">Error: ${e.message}</div>`;
    }
  }
}

function renderMessages(msgs) {
  const wrap = $('messages-wrap');
  const scrolledToBottom = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 60;

  // Agrupamos por fecha
  const groups = {};
  msgs.forEach(m => {
    const d = m.sentAt || m.timestamp || m.createdAt;
    const key = d ? new Date(d).toDateString() : 'Sin fecha';
    if (!groups[key]) groups[key] = [];
    groups[key].push(m);
  });

  wrap.innerHTML = '';

  const todayStr = new Date().toDateString();
  const yesterdayStr = (() => { const d=new Date(); d.setDate(d.getDate()-1); return d.toDateString(); })();

  Object.entries(groups).forEach(([dateKey, group]) => {
    let label = dateKey;
    if (dateKey === todayStr) label = 'Hoy';
    else if (dateKey === yesterdayStr) label = 'Ayer';
    else {
      const d = new Date(dateKey);
      if (!isNaN(d)) label = d.toLocaleDateString('es', { weekday:'long', day:'numeric', month:'long' });
    }
    const div = document.createElement('div');
    div.className = 'date-divider';
    div.textContent = label;
    wrap.appendChild(div);

    group.forEach(m => wrap.appendChild(buildMsgBubble(m)));
  });

  if (scrolledToBottom || !msgs.length) {
    wrap.scrollTop = wrap.scrollHeight;
  }
}

function buildMsgBubble(m) {
  const senderId = m.senderId || m.sender?.id || m.userId;
  const isMine   = senderId === MY_ID || m.isMine === true;

  const bub = document.createElement('div');
  bub.className = 'msg-bubble ' + (isMine ? 'msg-sent' : 'msg-received');

  const text = document.createElement('div');
  text.textContent = m.content || m.text || m.body || '';
  bub.appendChild(text);

  const meta = document.createElement('div');
  meta.className = 'msg-time';
  meta.textContent = formatFullTime(m.sentAt || m.timestamp || m.createdAt);

  if (isMine) {
    const check = document.createElement('span');
    check.className = 'msg-check';
    check.textContent = m.read ? '✓✓' : '✓';
    meta.appendChild(check);
  }
  bub.appendChild(meta);
  return bub;
}

// ── SEND MESSAGE ─────────────────────────────────────────
async function sendMessage() {
  if (!currentChat) return;
  const input = $('msg-input');
  const content = input.value.trim();
  if (!content) return;

  input.value = '';
  input.style.height = 'auto';
  $('send-btn').disabled = true;

  // Optimistic bubble
  const optimistic = buildMsgBubble({
    content,
    sentAt: new Date().toISOString(),
    senderId: MY_ID
  });
  $('messages-wrap').appendChild(optimistic);
  $('messages-wrap').scrollTop = $('messages-wrap').scrollHeight;

  try {
    await api('/messages', {
      method: 'POST',
      body: JSON.stringify({
        chatId:   currentChat.id,
        senderId: MY_ID,
        content,
        text: content,  // por si el campo se llama diferente
        body: content
      })
    });
    await loadMessages(currentChat.id, true);
  } catch (e) {
    optimistic.style.opacity = '0.4';
    showToast('Error enviando mensaje: ' + e.message, true);
  } finally {
    $('send-btn').disabled = false;
    input.focus();
  }
}

// ── NEW CONTACT ──────────────────────────────────────────
async function saveContact() {
  const name  = $('nc-name').value.trim();
  if (!name) { showToast('El nombre es obligatorio', true); return; }

  const body = {
    name,
    phone:    $('nc-phone').value.trim() || undefined,
    email:    $('nc-email').value.trim() || undefined,
    photoUrl: $('nc-photo').value.trim() || undefined,
  };

  try {
    await api('/contacts', { method: 'POST', body: JSON.stringify(body) });
    $('modal-overlay').classList.remove('open');
    ['nc-name','nc-phone','nc-email','nc-photo'].forEach(id => { $(id).value = ''; });
    showToast('Contacto creado ✓');
    loadContacts();
  } catch(e) {
    showToast('Error: ' + e.message, true);
  }
}

// ── DELETE CHAT ──────────────────────────────────────────
async function deleteCurrentChat() {
  if (!currentChat) return;
  if (!confirm('¿Eliminar este chat y todos sus mensajes?')) return;
  try {
    await api(`/chats/${currentChat.id}`, { method: 'DELETE' });
    currentChat = null; currentContact = null;
    $('empty-state').style.display = 'flex';
    $('chat-header').style.display = 'none';
    $('messages-wrap').style.display = 'none';
    $('input-area').style.display = 'none';
    clearInterval(pollTimer);
    showToast('Chat eliminado');
    loadContacts();
  } catch(e) {
    showToast('Error: ' + e.message, true);
  }
}

// ── EVENTS ───────────────────────────────────────────────
$('search-input').addEventListener('input', e => filterContacts(e.target.value));

$('send-btn').addEventListener('click', sendMessage);

$('msg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

$('msg-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  $('send-btn').disabled = !this.value.trim() || !currentChat;
});

$('refresh-btn').addEventListener('click', () => { if (currentChat) loadMessages(currentChat.id); });

$('delete-chat-btn').addEventListener('click', deleteCurrentChat);

$('new-contact-btn').addEventListener('click', () => $('modal-overlay').classList.add('open'));
$('modal-cancel').addEventListener('click', () => $('modal-overlay').classList.remove('open'));
$('modal-save').addEventListener('click', saveContact);
$('modal-overlay').addEventListener('click', e => { if (e.target === $('modal-overlay')) $('modal-overlay').classList.remove('open'); });

$('config-btn').addEventListener('click', e => {
  e.stopPropagation();
  $('config-panel').classList.toggle('open');
});
document.addEventListener('click', e => {
  if (!$('config-panel').contains(e.target)) $('config-panel').classList.remove('open');
});

$('cfg-save-btn').addEventListener('click', () => {
  BASE_URL = $('cfg-base-url').value.trim().replace(/\/$/, '');
  MY_ID    = parseInt($('cfg-user-id').value) || 1;
  localStorage.setItem('chatapp_base', BASE_URL);
  localStorage.setItem('chatapp_uid', MY_ID);
  $('uid-label').textContent = MY_ID;
  $('config-panel').classList.remove('open');
  showToast('Config guardada. Recargando...');
  setTimeout(() => { clearInterval(pollTimer); loadContacts(); }, 500);
});

// Enter en modal
$('nc-photo').addEventListener('keydown', e => { if (e.key === 'Enter') saveContact(); });

// ── INIT ─────────────────────────────────────────────────
loadContacts();
</script>
</body>
